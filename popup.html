<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Domain Proxy Router</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1>Domain Proxy Router</h1>
      <label class="switch" title="Enable/disable routing">
        <input id="enabledToggle" type="checkbox" />
        <span class="switch-track"></span>
      </label>
    </header>

    <section class="card">
      <h2>Proxies &amp; domains</h2>
      <p class="hint">
        Each proxy has its own domain list. If a domain is listed on several proxies,
        the top one wins — reorder with the arrows. Subdomains
        (<code>www.example.com</code>) are matched automatically.
      </p>

      <div id="proxyList" class="proxy-list"></div>
      <button id="addProxyButton" class="btn btn-block btn-add" type="button">
        + Add proxy
      </button>
    </section>

    <footer class="footer">
      <button id="saveButton" class="btn btn-primary btn-block">Save &amp; apply</button>
      <p id="statusMessage" class="status" aria-live="polite"></p>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
